labels:
  - nop-e2e
  - admin-login
customSteps: |
  // Admin authentication: an anonymous visitor is sent to the login form,
  // invalid credentials are refused, and valid ones reach the dashboard.

  // --- Unauthenticated access is redirected to the login form ---
  go to url stored value "adminUrl"
  check that page contains "Welcome, Please Sign In!"

  // --- An unknown account is rejected ---
  // The detail line differs by version: 4.90 says "No customer account found",
  // while 5.00 (#8131, no email enumeration) gives the generic wrong-credentials
  // text. The summary line is the same on both, and is rendered only after a
  // failed login.
  enter "not-an-admin@example.com" into "Email"
  enter "wrong_password" into "Password"
  click button "Log in"
  check that page contains "Login was unsuccessful"
  check that page contains "Welcome, Please Sign In!"

  // --- A real account with the wrong password is rejected too ---
  // Every version answers this with the generic message.
  enter stored value "adminEmail" into "Email"
  enter "wrong_password" into "Password"
  click button "Log in"
  check that page contains "The credentials provided are incorrect"

  // --- Valid credentials reach the dashboard ---
  admin-login
