# Full omnichannel demo stack for Scenario C.
#
# Phase 1 goal for Compose: every container starts, exposes its intended port,
# and reports healthy without requiring service-specific manual steps beyond the
# nopCommerce install wizard. End-to-end behavior is filled incrementally in
# later phases.
#
# Bring up:   docker compose up --build
# Storefront: http://localhost:8080
# RabbitMQ UI: http://localhost:15672 (guest/guest)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Omni_Demo_Pass1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SQLCMD=$$(command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd); $$SQLCMD -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omni_network

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - omni_network

  nopcommerce:
    build:
      context: ./nopCommerce
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost/install || wget -q --spider http://localhost/"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - omni_network

  wms-sim:
    build:
      context: ./services/wms-sim
    restart: unless-stopped
    environment:
      WMS_MODE: normal
      WMS_SLOW_DELAY_SECONDS: "3"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - omni_network

  pos-sim:
    build:
      context: ./services/pos-sim
    restart: unless-stopped
    environment:
      NopCommerce__BaseUrl: http://nopcommerce:80
      OmnichannelCore__DemoToken: omni-demo-token
    ports:
      - "8082:8080"
    depends_on:
      nopcommerce:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - omni_network

  worker:
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      Worker__RabbitMqUri: amqp://guest:guest@rabbitmq:5672/
      Worker__WmsBaseUrl: http://wms-sim:8080
      Worker__NopCommerceBaseUrl: http://nopcommerce:80
      Worker__DemoToken: omni-demo-token
    depends_on:
      rabbitmq:
        condition: service_healthy
      wms-sim:
        condition: service_healthy
      nopcommerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof dotnet >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - omni_network

networks:
  omni_network:
    driver: bridge

volumes:
  mssql_data:
