name: Build and Push nopCommerce to Docker Hub

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: .src/Presentation/Nop.Web/Dockerfile
          push: true
          tags: rajib25/nopcommerce490:latest

      - name: Notify Microsoft Teams
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="00FF00"
          if [ "$STATUS" != "success" ]; then COLOR="FF0000"; fi

          curl -X POST "${{ secrets.TEAMS_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [{
                \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                \"content\": {
                  \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                  \"type\": \"AdaptiveCard\",
                  \"version\": \"1.2\",
                  \"body\": [
                    {\"type\": \"TextBlock\", \"text\": \"nopCommerce CI/CD - $STATUS\", \"weight\": \"Bolder\", \"size\": \"Medium\"},
                    {\"type\": \"TextBlock\", \"text\": \"Commit: ${{ github.sha }}\"},
                    {\"type\": \"TextBlock\", \"text\": \"Message: ${{ github.event.head_commit.message }}\"},
                    {\"type\": \"TextBlock\", \"text\": \"By: ${{ github.actor }}\"},
                    {\"type\": \"TextBlock\", \"text\": \"Branch: ${{ github.ref_name }}\"}
                  ]
                }
              }]
            }"
